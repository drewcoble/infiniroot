<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>infinidraft</title>
    <script>
      (function () {
        var host = window.location.hostname;
        var suffix =
          host === "localhost" || host === "127.0.0.1"
            ? " (local)"
            : host.startsWith("develop.")
              ? " (dev)"
              : "";
        if (suffix) document.title += suffix;
      })();
    </script>
    <meta
      name="description"
      content="infinidraft has customizable auction draft tools for fantasy football — set your salary cap budget, choose keepers, and track draft values live."
    />
    <meta property="og:title" content="infinidraft" />
    <meta
      property="og:description"
      content="Customizable auction draft tools for fantasy football — set your salary cap budget, choose keepers, and track draft values live."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.infinidraft.com" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.png" />
  </head>

    <div id="root"></div>

  </body>
</html>
