<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>infinidraft</title>
    <script>
      // Tag the tab title on local and dev copies so they're easy to tell from production:
      // localhost / LAN / Tailscale addresses are "(local)", *-dev.infinifantasy.com (and the old
      // develop.* hosts) are "(dev)".
      (function () {
        var host = window.location.hostname;
        var local =
          host === "localhost" ||
          host.endsWith(".local") ||
          /^(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.)/.test(host);
        var dev = host.indexOf("-dev.") !== -1 || host.startsWith("develop.");
        if (local || dev) document.title += local ? " (local)" : " (dev)";
      })();
    </script>
    <meta
      name="description"
      content="infinidraft has customizable auction draft tools for fantasy football — set your salary cap budget, choose keepers, and track draft values live."
    />
    <meta property="og:title" content="infinidraft" />
    <meta
      property="og:description"
      content="Customizable auction draft tools for fantasy football — set your salary cap budget, choose keepers, and track draft values live."
    />

  </head>

</html>
