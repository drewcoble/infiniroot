<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>infinileague</title>
    <script>
      // Tag the tab title on local and dev copies so they're easy to tell from production:
      // localhost / LAN / Tailscale addresses are "(local)", *-dev.infinifantasy.com (and the old
      // develop.* hosts) are "(dev)".
      (function () {
        var host = window.location.hostname;
        var local =
          host === "localhost" ||
          host.endsWith(".local") ||
          /^(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.)/.test(host);
        var dev = host.indexOf("-dev.") !== -1 || host.startsWith("develop.");
        if (local || dev) document.title += local ? " (local)" : " (dev)";
      })();
    </script>
    <meta
      name="description"
      content="infinileague turns your fantasy football league's in-season data into waiver-wire recommendations, FAAB bid suggestions, and trade analysis."
    />
    <link rel="icon" type="image/png" href="/src/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
